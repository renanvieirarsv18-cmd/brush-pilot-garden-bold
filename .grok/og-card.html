<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "L";
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf");
    font-weight: 400;
  }
  @font-face {
    font-family: "L";
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf");
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #ededf0;
    font-family: "L", "Liberation Sans", sans-serif;
  }
  .frame {
    width: 1200px;
    height: 630px;
    position: relative;
    background:
      radial-gradient(520px 420px at 92% 108%, rgba(60, 191, 178, 0.22), transparent 70%),
      radial-gradient(480px 380px at 4% -8%, rgba(84, 84, 232, 0.16), transparent 68%),
      radial-gradient(280px 220px at 88% 8%, rgba(245, 185, 66, 0.28), transparent 70%),
      #ededf0;
  }
  .desk {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 118px;
    background: #ffffff;
    border-top: 1px solid #e4e4ea;
    box-shadow: 0 -18px 40px rgba(28, 28, 40, 0.05);
  }
  .desk-edge {
    position: absolute;
    left: 72px;
    right: 72px;
    top: 28px;
    height: 8px;
    border-radius: 999px;
    background: #ededf0;
  }
  .bell {
    position: absolute;
    left: 96px;
    bottom: 36px;
    width: 86px;
    height: 70px;
  }
  .lamp {
    position: absolute;
    right: 118px;
    bottom: 28px;
    width: 54px;
    height: 86px;
  }
  .vase {
    position: absolute;
    right: 196px;
    bottom: 34px;
    width: 36px;
    height: 62px;
  }
  .lockup {
    position: absolute;
    left: 0;
    right: 0;
    top: 78px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .mark {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #5454e8;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 24px rgba(84, 84, 232, 0.28);
    margin-bottom: 28px;
  }
  .kicker {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.46em;
    color: #5454e8;
    text-indent: 0.46em;
    line-height: 1;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 118px;
    font-weight: 700;
    letter-spacing: -0.035em;
    color: #1c1c22;
    line-height: 0.92;
  }
  .rule {
    width: 72px;
    height: 6px;
    border-radius: 999px;
    background: #f5b942;
    margin: 26px 0 18px;
  }
  .tag {
    font-size: 28px;
    font-weight: 400;
    color: #6d6d78;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="lockup">
      <div class="mark" aria-hidden="true">
        <svg width="38" height="38" viewBox="0 0 32 32" fill="none">
          <path fill="#ffffff" d="M16 5.4c.8 0 1.4.6 1.4 1.4v1.2c4 .7 7 4 7 8.1v3.6l1.7 2.4c.5.6 0 1.5-.8 1.5H6.7c-.8 0-1.3-.9-.8-1.5l1.7-2.4v-3.6c0-4.1 3-7.4 7-8.1V6.8c0-.8.6-1.4 1.4-1.4z"/>
          <rect x="12.6" y="24.6" width="6.8" height="2.8" rx="1.4" fill="#f5b942"/>
          <circle cx="23.2" cy="9.2" r="2.2" fill="#3cbfb2"/>
        </svg>
      </div>
      <div class="kicker">GUIA DA</div>
      <h1>Recepção</h1>
      <div class="rule"></div>
      <div class="tag">Para quem está chegando</div>
    </div>
    <div class="desk" aria-hidden="true">
      <div class="desk-edge"></div>
      <svg class="bell" viewBox="0 0 86 70">
        <path d="M18 52c0-16 11-30 25-30s25 14 25 30" fill="#5454e8"/>
        <rect x="10" y="50" width="66" height="8" rx="4" fill="#5454e8"/>
        <circle cx="43" cy="16" r="5" fill="#f5b942"/>
        <rect x="36" y="60" width="14" height="6" rx="3" fill="#3cbfb2"/>
      </svg>
      <svg class="vase" viewBox="0 0 36 62">
        <path d="M18 28c-2 8-8 12-8 22 0 4 3 8 8 8s8-4 8-8c0-10-6-14-8-22z" fill="#3cbfb2"/>
        <path d="M18 30c0-10 6-16 10-22" stroke="#2f9e92" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <circle cx="28" cy="6" r="5" fill="#3cbfb2"/>
      </svg>
      <svg class="lamp" viewBox="0 0 54 86">
        <path d="M10 28h34L36 8H18z" fill="#f5b942"/>
        <rect x="24" y="28" width="6" height="40" fill="#1c1c22"/>
        <rect x="12" y="68" width="30" height="6" rx="3" fill="#1c1c22"/>
      </svg>
    </div>
  </div>
</body>
</html>
